spring:
  application:
    name: water-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/water"
  flyway:
    url: ${flyway-url:jdbc:postgresql://${database.host}:${database.port}/${database.name}}
    user: ${database-user:dummyUser}
    password: ${database-password:dummyPassword}
    enabled: on

database:
  host: ${database-host:localhost}
  port: ${database-port:5432}
  name: ${database-name:dummyName}
  username: ${database-user:dummyUser}
  password: ${database-password:dummyPassword}

server:
  port: 6200

logbook:
  format:
    style: json

logging:
  level:
    org.zalando.logbook: trace

shelly:
  sensor:
    uni:
      hot-water:
        host: 10.78.30.47
        port: 80

---

spring:
  config:
    activate:
      on-profile: local

server:
  port: 6006
management:
  server:
    port: 8006

logbook:
  format:
    style: http
---

spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
