spring:
  application:
    name: water-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/water"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  rabbitmq:
    host: rabbitmq-headless
    port: 5672
    # the events of every device (HAS-316): the Shelly devices over MQTT and the Eaton devices from amx-service, all
    # on amq.topic of /device, each queue bound with "#" - the water valve is picked by its device id
    username: device
    # no default on purpose: with one the pod would start, turn Ready and consume nothing. Without the variable the
    # service does not start - cholewa.required-properties sees to that, the binder alone would take the placeholder
    # for the password
    password: ${rabbitmq-password}
    virtual-host: /device
    connection-timeout: 10s
    requested-heartbeat: 10s
    template:
      # both default to false; without them the trace breaks at the queue
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        # the listener returns a Mono; with the default AUTO mode the container acks before the message is handled,
        # so prefetch throttles nothing and the ack is sent twice
        acknowledge-mode: manual
        # how many events are in flight at once, the rest waits in the broker - as in energy-service
        prefetch: 3
  flyway:
    url: ${flyway-url:jdbc:postgresql://${database.host}:${database.port}/${database.name}}
    user: ${database-user:dummyUser}
    password: ${database-password:dummyPassword}
    enabled: on

database:
  host: ${database-host:localhost}
  port: ${database-port:5432}
  name: ${database-name:dummyName}
  username: ${database-user:dummyUser}
  password: ${database-password:dummyPassword}
  pool:
    # this service's share of the 22 backend connections the managed database allows
    # (heating 2 / database 4 / water 2 / presence 2, 12 free); left out, the pool silently
    # falls back to the library default of 4. It was 4 up to and including 0.5.0: a rollout
    # holds the pool twice and Flyway opens one more connection over JDBC, and with this split
    # even the three rolling services at once fit the budget (HAS-169)
    max-size: 2

rabbitmq:
  queue:
    name: device.prod.water

internal:
  service:
    # the device registry: the water valve of the house (HAS-311, HAS-316)
    database: http://database-service:6200
    # whether anybody is at home, for the flow of the empty house (HAS-320)
    presence: http://presence-service:6200

water:
  # the water valve (HAS-316): a value not reported for stale-after - by MQTT or by the read of every minute - is left out
  # of GET /valve (a bare number is minutes, 2 - 60)
  valve:
    stale-after: PT5M
  # the readings of the counter of the valve kept for the history; older rows are deleted every night (a bare number is
  # days)
  meter:
    retention: 730d
  # the alarms of the valve (HAS-319): an alert after the bound, a reminder every reminder-every, an info on the return.
  # Pressures in kPa (the unit of the valve), temperatures in degrees C, a bare duration is minutes
  alarm:
    pressure-low-below: 100
    pressure-low-after: PT5M
    offline-after: PT5M
    frost-below: 3
    frost-after: PT5M
    reminder-every: PT1H
  # the flow alarms (HAS-320, the defaults of the owner 2026-10-23): flows in l/min, a bare duration is minutes. A high
  # flow above high-above for high-after; a continuous flow above zero for continuous-after, a pause no longer than
  # continuous-pause the same flow; any flow above empty-house-above while the house is empty for empty-house-after
  flow:
    high-above: 25
    high-after: PT3M
    continuous-pause: PT1M
    continuous-after: PT30M
    empty-house-above: 0.5
    empty-house-after: PT2M
    # the continuous flow and the empty house close the valve at their alert (HAS-321, source rule) - off by the choice of
    # the owner; the high flow never does
    close-on-alarm: false
  # the circulation pump of the hot water (HAS-404), relay 1 of the Shelly Uni: temperatures in degrees C, a bare duration
  # is minutes. A run stops once the return reaches return-target (with stop-on-return) or after max-run - also the timer
  # sent with the start, which flips the relay back should the service not; a start is refused below tank-min.
  # stop-on-return is decided at the first real start with the owner: false when the sensor is not on the return
  circulation:
    return-target: 35
    max-run: PT3M
    tank-min: 38
    stop-on-return: true

# the notifications of the alarms (HAS-319): the exchange is on the same broker as spring.rabbitmq.*, on its own virtual
# host - a second connection (NotificationRabbitConfig); env is one of the two headers it routes by.
# cholewa.notification.enabled of cholewa-commons stays unset: its publisher uses the connection to /device
notification:
  virtual-host: /notification
  username: notification
  # no default on purpose: with one the pod would start and fail every publish (cholewa.required-properties)
  password: ${notification-rabbitmq-password}
  exchange: notification
  env: prod

cholewa:
  # refuses the start before the first bean when one of these has no value (cholewa-commons >= 1.9.0)
  required-properties:
    - property: spring.rabbitmq.password
      variable: rabbitmq-password
    - property: notification.password
      variable: notification-rabbitmq-password

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      # a 404 on the readiness path crash-loops the pod, so the probe groups are pinned here
      # instead of relying on Boot detecting the Kubernetes platform — and kept in the shared
      # document, where the paths can be exercised locally on 8006 before the manifest ships
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

shelly:
  # the clients and the MQTT decoder of shelly-client are on since HAS-316 (the water valve); the Shelly Uni of the hot
  # water is still read by WaterSensorClient
  sensor:
    uni:
      hot-water:
        host: 10.78.30.47
        port: 80

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: localhost

rabbitmq:
  queue:
    name: device.dev.water

internal:
  service:
    database: http://localhost:6005
    presence: http://localhost:6009

# a local run never posts to the channel of the house: dev is routed to the dev queues
notification:
  env: dev

server:
  port: 6006
management:
  server:
    port: 8006

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
---

spring:
  config:
    activate:
      on-profile: test
  # a context test starts the listener: the broker is at an address nothing listens on, so that a test cannot reach it
  # even where the name resolves
  rabbitmq:
    host: localhost
    port: 1
    password: test
  flyway:
    enabled: false

rabbitmq:
  queue:
    name: device.test.water

internal:
  service:
    database: http://localhost:1
    presence: http://localhost:1

notification:
  password: test
  env: test

# second line of defence: SchedulingConfig schedules nothing under this profile, and should anything in a
# test call the Shelly all the same, it must not reach the device of the house
shelly:
  sensor:
    uni:
      hot-water:
        host: localhost
        port: 1

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
